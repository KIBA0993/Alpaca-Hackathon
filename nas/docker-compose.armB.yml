# Arm B — 0DTE PAPER agent, LADDER exit + 1-min manage cadence.
# Synology DS920+, Container Manager (Docker 20.10.3), compose v1 — NO `version:`.
#
# A fully isolated SIBLING of the arm-A stack (nas/docker-compose.yml): its own
# NAS dir (/volume1/docker/alpaca-hackathon-armB), own image + container name,
# own .env.armB (a DIFFERENT paper account), own logs. Same codebase — the only
# behavioural difference is AGENT_CONFIG=config.armB.json (ladder exit,
# manage_step_minutes=1). It cannot read or write arm A or the trading tree.
#
#   cd /volume1/docker/alpaca-hackathon-armB/nas
#   sudo /usr/local/bin/docker-compose -f docker-compose.armB.yml up -d --build
services:
  agent:
    build:
      context: ..
      dockerfile: nas/Dockerfile
    # Docker image tags MUST be lowercase (repository names reject uppercase).
    # container_name keeps the -armB casing, which container names allow, and
    # matches NAME in deploy-to-nas.sh (used by the post-start `docker exec` check).
    image: alpaca-hackathon-armb:latest
    container_name: alpaca-hackathon-armB
    restart: unless-stopped
    # Arm B's OWN paper account. .env.armB holds ALPACA_API_KEY /
    # ALPACA_SECRET_KEY / ALPACA_PAPER=true and NO ALPACA_LIVE_TRADE.
    env_file:
      - ../.env.armB
    environment:
      TZ: America/New_York
      PYTHONUNBUFFERED: "1"
      # Selects the ladder-exit config; run_daily.py appends --config for this.
      AGENT_CONFIG: config.armB.json
    volumes:
      - ../logs:/app/logs
      - ../.env.armB:/app/.env:ro
    dns:
      - 1.1.1.1
      - 8.8.8.8
